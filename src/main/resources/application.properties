# ====================================================
# application.properties
# Online Complaint Management System - Backend Config
# ====================================================

# ── SERVER CONFIGURATION ──────────────────────────
server.port=${PORT:8080}

# ── APPLICATION NAME ──────────────────────────────
spring.application.name=complaint-management-system

# ── DATABASE CONFIGURATION ────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/complaint_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / HIBERNATE CONFIGURATION ─────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── FILE UPLOAD CONFIGURATION ─────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ── JWT CONFIGURATION ─────────────────────────────
app.jwt.secret=${JWT_SECRET:MySecretKeyForComplaintManagementSystemJWT2026}
# 15 mins
app.jwt.expiration=${JWT_EXPIRATION:900000}
# 7 days
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── LOGGING CONFIGURATION ─────────────────────────
logging.level.com.example.complaintmanagement=INFO
logging.level.org.springframework.security=INFO

# ── CORS CONFIGURATION ────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}}

# ── GMAIL / EMAIL NOTIFICATION CONFIGURATION ──────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:resolver.cms.notifications@gmail.com}
spring.mail.password=${GMAIL_PASSWORD:app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.enabled=${MAIL_ENABLED:true}

# ── SWAGGER / OPENAPI CONFIG ──────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
