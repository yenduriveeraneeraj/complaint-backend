# ====================================================
# application.properties
# Online Complaint Management System - Backend Config
# ====================================================

# ── SERVER CONFIGURATION ──────────────────────────
# Port where Spring Boot runs
server.port=8080

# Context path (all APIs will be under /api)
# We set this in each controller instead

# ── APPLICATION NAME ──────────────────────────────
spring.application.name=complaint-management-system

# ── DATABASE CONFIGURATION ────────────────────────
# IMPORTANT: Change username and password to match your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/complaint_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / HIBERNATE CONFIGURATION ─────────────────
# create-drop : Creates tables at startup, drops at shutdown (good for first run)
# update      : Updates tables automatically (use after first run)
# validate    : Only validates schema (use in production)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (useful during development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL8 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── FILE UPLOAD CONFIGURATION ─────────────────────
# Maximum size of a single file
spring.servlet.multipart.max-file-size=10MB
# Maximum size of entire request
spring.servlet.multipart.max-request-size=10MB
# Directory where uploaded files will be stored
app.upload.dir=./uploads

# ── JWT CONFIGURATION ─────────────────────────────
# Secret key for signing JWT tokens (change this in production!)
# This must be at least 256 bits (32 characters) long
app.jwt.secret=MySecretKeyForComplaintManagementSystemJWT2026
# JWT expiration in milliseconds: 86400000 = 24 hours
app.jwt.expiration=86400000

# ── LOGGING CONFIGURATION ─────────────────────────
logging.level.com.example.complaintmanagement=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ── CORS CONFIGURATION ────────────────────────────
# React frontend URL (allow cross-origin requests)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── GMAIL / EMAIL NOTIFICATION CONFIGURATION ──────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:resolver.cms.notifications@gmail.com}
spring.mail.password=${GMAIL_PASSWORD:app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.enabled=true
